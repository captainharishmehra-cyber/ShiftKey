name: React frontend build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build React frontend
        working-directory: frontend
        run: npm run build
      - name: Verify built app assets
        run: test -s app/static/react/index.html && find app/static/react/assets -maxdepth 1 -type f -print
      - name: Build production Docker image
        run: docker build -t shiftkey-react-check .
